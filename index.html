<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pikachu UI</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= MAIN CONTAINER ================= -->

  <div class="container">

    <!-- ================= LEFT SECTION ================= -->

    <section class="left">

      <div class="content">

        <!-- LOGO -->

        <img 
          class="logo"
          src="https://upload.wikimedia.org/wikipedia/commons/9/98/International_Pok%C3%A9mon_logo.svg" 
          alt="pokemon logo"
        >

        <!-- SMALL TEXT -->

        <p class="tag">
          POKEMON GEN I
        </p>

        <!-- TITLE -->

        <h1>Pikachu</h1>

        <!-- DESCRIPTION -->

        <p class="description">
          Pikachu is an Electric-type Pokémon introduced
          in Generation I. Pikachu are small, chubby,
          and incredibly cute mouse-like Pokémon.
          They are almost completely covered by
          yellow fur.
        </p>

        <!-- SLIDER INFO -->

        <div class="slider-info">

          <div class="line"></div>

          <span>01 / 08</span>

        </div>

      </div>

      <!-- POKEBALL -->

      <div class="pokeball"></div>

    </section>

    <!-- ================= RIGHT SECTION ================= -->

    <section class="right">

      <!-- MENU -->

      <div class="menu">

        <span></span>
        <span></span>
        <span></span>

      </div>

      <!-- DOTS -->

      <div class="dots">

        <span class="active"></span>
        <span></span>
        <span></span>
        <span></span>

      </div>

      <!-- PIKACHU IMAGE -->

      <img 
        class="pikachu"
        src="Pikachu_-_Pokémon_-_Nintendo-removebg-preview.png" 
        alt="pikachu"
      >

    </section>

  </div>

</body>
</html>
